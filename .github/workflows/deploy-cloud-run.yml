name: Deploy Cloud Run API

# Builds and deploys hamula-api on every push to main.
# Firebase Hosting rewrites /api/**, /health, /qr, and /download to this service.
#
# Required: GitHub Actions authenticates via Workload Identity Federation
# (pool github-actions / provider github → github-actions-cloudrun@hamula-cfc6c).
# Optional JSON fallback: GCP_SA_KEY or FIREBASE_SERVICE_ACCOUNT.
#
# Optional (keep existing Cloud Run values when omitted):
#   TAP_SECRET_KEY             — sk_test_* while MIRAS_DEPLOY_ENV=staging
#   TAP_PUBLIC_KEY             — pk_test_* while MIRAS_DEPLOY_ENV=staging
#
# Optional repository / environment variables:
#   MIRAS_DEPLOY_ENV           — staging (default) or production
#   CLOUD_RUN_APP_URL          — https://hamula-cfc6c.web.app
#   APP_CHECK_ENFORCE          — false (default)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloud-run-hamula-api
  cancel-in-progress: true

env:
  PROJECT_ID: hamula-cfc6c
  SERVICE_NAME: hamula-api
  REGION: us-central1
  APP_URL: ${{ vars.CLOUD_RUN_APP_URL || 'https://hamula-cfc6c.web.app' }}
  DEPLOY_ENV: ${{ vars.MIRAS_DEPLOY_ENV || 'staging' }}
  APP_CHECK_ENFORCE: ${{ vars.APP_CHECK_ENFORCE || 'false' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Hosting secrets (FIREBASE_SERVICE_ACCOUNT, Tap keys) live here.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API bundle
        run: npm run build:server

      - name: Validate deploy env
        env:
          TAP_SECRET_KEY: ${{ secrets.TAP_SECRET_KEY }}
          TAP_PUBLIC_KEY: ${{ secrets.TAP_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${TAP_SECRET_KEY}" ]]; then
            echo "TAP_SECRET_KEY is not in GitHub secrets — keeping the key already set on Cloud Run."
          elif [[ "${DEPLOY_ENV}" == "staging" && "${TAP_SECRET_KEY}" != sk_test_* ]]; then
            echo "Staging Cloud Run requires a Tap TEST secret (sk_test_*)."
            exit 1
          elif [[ "${DEPLOY_ENV}" == "production" && "${TAP_SECRET_KEY}" != sk_live_* ]]; then
            echo "Production Cloud Run requires a Tap LIVE secret (sk_live_*)."
            exit 1
          fi
          if [[ -z "${TAP_PUBLIC_KEY}" ]]; then
            echo "TAP_PUBLIC_KEY unset — keeping the key already set on Cloud Run."
          elif [[ "${DEPLOY_ENV}" == "staging" && "${TAP_PUBLIC_KEY}" != pk_test_* ]]; then
            echo "Staging Cloud Run requires a Tap TEST public key (pk_test_*)."
            exit 1
          elif [[ "${DEPLOY_ENV}" == "production" && "${TAP_PUBLIC_KEY}" != pk_live_* ]]; then
            echo "Production Cloud Run requires a Tap LIVE public key (pk_live_*)."
            exit 1
          fi
          if [[ "${APP_URL}" != https://* ]]; then
            echo "APP_URL must be HTTPS for Tap redirects (got: ${APP_URL})"
            exit 1
          fi

      - name: Authenticate to Google Cloud (Workload Identity)
        id: auth_wif
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/191963635866/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-cloudrun@hamula-cfc6c.iam.gserviceaccount.com

      - name: Authenticate to Google Cloud (JSON fallback)
        if: steps.auth_wif.outcome == 'failure'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy hamula-api
        env:
          TAP_SECRET_KEY: ${{ secrets.TAP_SECRET_KEY }}
          TAP_PUBLIC_KEY: ${{ secrets.TAP_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          UPDATE_VARS="NODE_ENV=production,MIRAS_PROCESS_ROLE=api,MIRAS_DEPLOY_ENV=${DEPLOY_ENV},HAMOULA_DEPLOY_ENV=${DEPLOY_ENV},FIREBASE_PROJECT_ID=${PROJECT_ID},MIRAS_EXPECTED_FIREBASE_PROJECT=${PROJECT_ID},HAMOULA_EXPECTED_FIREBASE_PROJECT=${PROJECT_ID},APP_URL=${APP_URL},APP_CHECK_ENFORCE=${APP_CHECK_ENFORCE},APP_STORE_APPLE_ID=6807503584,TAP_MERCHANT_ID=68064164"
          if [[ -n "${TAP_SECRET_KEY}" ]]; then
            UPDATE_VARS="${UPDATE_VARS},TAP_SECRET_KEY=${TAP_SECRET_KEY}"
          fi
          if [[ -n "${TAP_PUBLIC_KEY}" ]]; then
            UPDATE_VARS="${UPDATE_VARS},TAP_PUBLIC_KEY=${TAP_PUBLIC_KEY}"
          fi
          gcloud run deploy "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --source=. \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --quiet \
            --update-env-vars="${UPDATE_VARS}"

      - name: Smoke-test /health
        run: |
          URL="$(gcloud run services describe "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.url)')"
          echo "Deployed: ${URL}"
          echo "Health:   ${URL}/health"
          echo "Same-origin after Hosting rewrites: ${APP_URL}/health"
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 20 "${URL}/health"; then
              echo
              exit 0
            fi
            echo "Health check attempt ${i} failed — retrying..."
            sleep 5
          done
          echo "hamula-api /health did not return success after deploy."
          exit 1
