name: Deploy Hosting

# Production SPA → Firebase Hosting (hamula-cfc6c) on every push to main.
# Auth matches Cloud Run: Workload Identity Federation for
# github-actions-cloudrun@hamula-cfc6c. That account needs Firebase Hosting Admin.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hosting-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      NODE_ENV: production
      VITE_MIRAS_DEPLOY_ENV: production
      VITE_APP_CHECK_DISABLED: "false"
      VITE_FIREBASE_API_KEY: AIzaSyAfJ_BXR_EL3jJK1t9Ud-vVzmIQQFBD9Cs
      VITE_FIREBASE_AUTH_DOMAIN: hamula-cfc6c.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: hamula-cfc6c
      VITE_FIREBASE_STORAGE_BUCKET: hamula-cfc6c.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "191963635866"
      VITE_FIREBASE_APP_ID: "1:191963635866:web:b9813435125d467d34bf23"
      VITE_FIREBASE_MEASUREMENT_ID: G-04GKH516ND
      VITE_GOOGLE_MAPS_PLATFORM_KEY: AIzaSyAFZLw-5D58K6_eTTxohsY7hNjzh8K2Rlw
      VITE_APP_CHECK_RECAPTCHA_SITE_KEY: 6Lf0czctAAAAAF7EECTuyfcTMJpA7HCTBlLp7Syb
      VITE_APP_URL: https://hamula-cfc6c.web.app
      VITE_API_ORIGIN: https://hamula-cfc6c.web.app
      VITE_IOS_TEAM_ID: 4TRJXRYK8A
      VITE_SUPPORT_EMAIL: support@jzlogistics.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Strip test / review client flags
        run: |
          unset VITE_ENABLE_DEV_AUTH_BYPASS VITE_PHONE_AUTH_TESTING VITE_APP_CHECK_DEBUG_TOKEN APPLE_REVIEW_PHONE APPLE_REVIEW_OTP
          echo "VITE_MIRAS_DEPLOY_ENV=${VITE_MIRAS_DEPLOY_ENV:-production}" >> "$GITHUB_ENV"
          echo "NODE_ENV=production" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          export NPM_CONFIG_PRODUCTION=false
          npm ci --include=dev

      - name: Verify production client env
        run: npx tsx scripts/verify-store-client.ts

      - name: Build SPA
        run: npm run build:web

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/191963635866/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-cloudrun@hamula-cfc6c.iam.gserviceaccount.com

      - name: Deploy Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project hamula-cfc6c --non-interactive
