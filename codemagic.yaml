# Codemagic CI — Capacitor iOS → TestFlight
#
# Layout (no CocoaPods workspace):
#   ios/App/App.xcodeproj
#   shared scheme: App (ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme)
#   bundle ID: com.ahmed.miras
#   team: 4TRJXRYK8A  (Xcode DEVELOPMENT_TEAM / Codemagic var; VITE_IOS_TEAM_ID is for web AASA)
#
# Codemagic UI required:
# 1. Developer Portal API key name must match integrations.app_store_connect
# 2. Code signing identities: Apple Distribution cert + App Store profile for
#    com.ahmed.miras WITH Associated Domains enabled on the App ID:
#    applinks:hamula-cfc6c.web.app and applinks:hamula-cfc6c.firebaseapp.com
# 3. Env group `miras_client` must include:
#    VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
#    VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID,
#    VITE_GOOGLE_MAPS_PLATFORM_KEY, VITE_APP_CHECK_RECAPTCHA_SITE_KEY, VITE_APP_URL,
#    VITE_MIRAS_DEPLOY_ENV, VITE_IOS_TEAM_ID, VITE_ANDROID_SHA256_CERT_FINGERPRINTS,
#    GOOGLE_SERVICE_INFO_PLIST (base64 of iOS GoogleService-Info.plist)
#    Do NOT set VITE_ENABLE_DEV_AUTH_BYPASS, VITE_PHONE_AUTH_TESTING, VITE_APP_CHECK_DEBUG_TOKEN.

workflows:
  ios-testflight:
    name: Miras iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ahmed.miras
      groups:
        - miras_client
      vars:
        XCODE_PROJECT_PATH: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.ahmed.miras
        DEVELOPMENT_TEAM: 4TRJXRYK8A
        # Optional override. Build number lookup uses --bundle-id when this is unset.
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Write native Firebase config
        script: |
          PLIST="$CM_BUILD_DIR/ios/App/App/GoogleService-Info.plist"
          if [ -n "${GOOGLE_SERVICE_INFO_PLIST:-}" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > "$PLIST"
          fi
          if [ ! -f "$PLIST" ]; then
            echo "Missing $PLIST — xcodebuild cannot load the App target without it."
            echo "Add GOOGLE_SERVICE_INFO_PLIST (base64 of Firebase iOS plist for com.ahmed.miras) to group miras_client."
            exit 1
          fi
      - name: Verify miras_client production env
        script: |
          npx tsx scripts/verify-store-client.ts --require-ios-plist
      - name: Build web assets and sync Capacitor iOS
        script: |
          unset VITE_ENABLE_DEV_AUTH_BYPASS VITE_PHONE_AUTH_TESTING VITE_APP_CHECK_DEBUG_TOKEN
          export NODE_ENV=production
          export CAPACITOR_BUILD=1
          export VITE_IOS_TEAM_ID="${VITE_IOS_TEAM_ID:-$DEVELOPMENT_TEAM}"
          npx vite build
          npx cap sync ios
          node scripts/fix-ios-spm-app-check.mjs
      - name: Install signing certificates and profiles
        script: |
          # Internal TestFlight only — skip Apple beta review. Remove
          # testFlightInternalTestingOnly when you need external testers.
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT_PATH" \
            --custom-export-options='{"method":"app-store","signingStyle":"manual","teamID":"'"$DEVELOPMENT_TEAM"'","compileBitcode":false,"testFlightInternalTestingOnly":true}'
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            "$CM_BUILD_DIR/ios/App/App.xcodeproj/project.pbxproj"
      - name: Increment iOS build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          LATEST=0
          if [ -n "${APP_STORE_APPLE_ID:-}" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || true)
            if [ -z "$LATEST" ] || [ "$LATEST" = "None" ]; then
              LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || true)
            fi
          fi
          if [ -z "$LATEST" ] || [ "$LATEST" = "None" ] || [ "$LATEST" = "0" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number --bundle-id "$BUNDLE_ID" || true)
          fi
          if [ -z "$LATEST" ] || [ "$LATEST" = "None" ]; then
            LATEST=$(app-store-connect get-latest-app-store-build-number --bundle-id "$BUNDLE_ID" || true)
          fi
          case "$LATEST" in
            ''|None|none) LATEST=0 ;;
          esac
          NEW_BUILD=$((LATEST + 1))
          if [ "$NEW_BUILD" -lt "${BUILD_NUMBER:-1}" ]; then
            NEW_BUILD=$BUILD_NUMBER
          fi
          agvtool new-version -all "$NEW_BUILD"
          agvtool new-marketing-version "1.0"
          echo "Using CFBundleVersion=$NEW_BUILD"
      - name: Resolve packages and verify Xcode can read settings
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/ios/App"
          PACKAGES_DIR="$CM_BUILD_DIR/build/ios/SourcePackages"
          mkdir -p "$PACKAGES_DIR"
          xcodebuild -list -project App.xcodeproj
          xcodebuild -project App.xcodeproj -scheme "$XCODE_SCHEME" \
            -clonedSourcePackagesDirPath "$PACKAGES_DIR" \
            -skipPackagePluginValidation \
            -resolvePackageDependencies
          xcodebuild -project App.xcodeproj -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath "$PACKAGES_DIR" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            -showBuildSettings
      - name: Archive and export signed IPA
        script: |
          set -euo pipefail
          PROJECT="$CM_BUILD_DIR/$XCODE_PROJECT_PATH"
          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive"
          IPA_DIR="$CM_BUILD_DIR/ios/App/build/ios/ipa"
          PACKAGES_DIR="$CM_BUILD_DIR/build/ios/SourcePackages"
          mkdir -p "$(dirname "$ARCHIVE_PATH")" "$IPA_DIR" "$PACKAGES_DIR"
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -clonedSourcePackagesDirPath "$PACKAGES_DIR" \
            -skipPackagePluginValidation \
            -skipPackageUpdates \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            ENABLE_MODULE_VERIFIER=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            ENABLE_APPINTENTS_METADATA_EXTRACTION=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
          EXPORT_PLIST="/Users/builder/export_options.plist"
          if [ ! -f "$EXPORT_PLIST" ]; then
            EXPORT_PLIST="$CM_BUILD_DIR/ios/ExportOptions.codemagic.plist"
          fi
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -exportPath "$IPA_DIR"
          ls -la "$IPA_DIR"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - support@miras.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # Upload the IPA only. submit_to_testflight submits the build for
        # Apple's external TestFlight beta review during Magic Actions
        # post-processing — that fails for internal-only IPAs and when
        # TestFlight beta details are incomplete. Internal testers still
        # get the build after Apple processing. Set true later only after
        # removing testFlightInternalTestingOnly and filling ASC beta info.
        submit_to_testflight: false
        submit_to_app_store: false

  android-internal:
    name: Miras Android Play internal
    max_build_duration: 90
    instance_type: linux_x2
    environment:
      groups:
        - miras_client
      vars:
        PACKAGE_NAME: com.miras.app
      node: 22
      java: 17
    scripts:
      - name: Require Play signing fingerprints and client env
        script: |
          unset VITE_ENABLE_DEV_AUTH_BYPASS VITE_PHONE_AUTH_TESTING VITE_APP_CHECK_DEBUG_TOKEN
          export NODE_ENV=production
          export CAPACITOR_BUILD=1
          npx tsx scripts/verify-store-client.ts --require-app-links
      - name: Install npm dependencies
        script: npm ci
      - name: Write google-services.json
        script: |
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          fi
          if [ ! -f android/app/google-services.json ]; then
            echo "Add GOOGLE_SERVICES_JSON (base64 of android/app/google-services.json) to miras_client."
            exit 1
          fi
      - name: Build web and sync Android
        script: |
          export CAPACITOR_BUILD=1
          node scripts/vite-capacitor.mjs
          npx cap sync android
      - name: Assemble release bundle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab

