# Render Blueprint — 24/7 email / payout worker (not the public Firebase SPA).
# Native Node so the dashboard start command `npm run dev` resolves server.ts.
# Starter+ required: free web services sleep and IMAP drops.
#
# https://render.com/docs/blueprint-spec

services:
  - type: worker
    name: miras-agents
    runtime: node
    plan: starter
    region: frankfurt
    numInstances: 1
    buildCommand: npm ci
    startCommand: npm run dev
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: MIRAS_PROCESS_ROLE
        value: agents
      - key: MIRAS_AGENTS_ENABLED
        value: "true"
      - key: MIRAS_DEPLOY_ENV
        value: staging
      - key: FIREBASE_PROJECT_ID
        value: hamula-cfc6c
      - key: APP_URL
        value: https://hamula-cfc6c.web.app
      - key: MIRAS_SUPPORT_EMAIL
        value: support@miras.com
      - key: MIRAS_ADMIN_EMAIL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: support@miras.com
      - key: IMAP_HOST
        value: imap.gmail.com
      - key: IMAP_PORT
        value: "993"
      - key: IMAP_SECURE
        value: "true"
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASS
        sync: false
      - key: IMAP_POLL_MS
        value: "15000"
      - key: MIRAS_AGENTS_SKIP_BOOT_EMAIL
        value: "true"
